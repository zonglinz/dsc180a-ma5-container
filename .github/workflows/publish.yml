name: Build, test, and publish MA 5 image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ma5-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image for DSMLP
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$GITHUB_SHA" .

      - name: Verify runtime packages and default command
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 "$IMAGE:latest" bash /usr/local/bin/verify-ma5
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE:latest")" = '["/bin/bash"]'
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE:latest")" = 'amd64'
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE:latest")" = 'jovyan'

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish verified image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          {
            echo '## Image published'
            echo
            echo "Gradescope path (without a tag): $IMAGE"
            echo
            echo 'Set the GHCR package visibility to Public, verify an anonymous pull, and test on DSMLP before submitting.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io
